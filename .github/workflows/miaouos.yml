name: MiaouOS CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miaouos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libelf-dev libssl-dev cpio xz-utils wget qemu-system-x86 xvfb python3

      - name: Check shell syntax and package engine
        run: |
          bash -n ./scripts/build.sh ./scripts/test-package-engine.sh ./scripts/test-miaou-ui.sh
          sh -n ./src/init ./src/miaoudesk.sh ./src/usr/bin/miaou ./src/usr/bin/miaou-get ./src/usr/lib/miaou/package-engine.sh ./src/usr/lib/miaou/ui.sh
          bash ./scripts/test-miaou-ui.sh
          sudo bash ./scripts/test-package-engine.sh

      - name: Build independent Linux system
        run: JOBS=2 bash ./scripts/build.sh

      - name: Boot in QEMU and capture screen
        run: xvfb-run -a bash ./scripts/test-qemu.sh

      - name: Upload kernel, initramfs, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaouos-ci-${{ github.run_number }}
          path: |
            build/miaouos-kernel-bzImage
            build/miaouos-initramfs.cpio.gz
            build/SHA256SUMS
            build/qemu-serial.log
            build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
